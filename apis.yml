name: Tonik
description: >-
  Tonik is the first digital-only neobank in the Philippines, operated by Tonik Digital Bank, Inc.
  under a digital banking license from the Bangko Sentral ng Pilipinas (BSP). Delivered entirely
  through a consumer mobile app, Tonik offers retail deposit accounts, high-interest savings
  "Stashes", time deposits, and consumer/quick loans, together with everyday payments and transfers
  for Filipino customers. The company positions itself around fast, easy, and secure mobile-first
  banking and is backed by investors including Prosus Ventures. As of this profile Tonik publishes
  no public developer API, SDKs, or developer portal; this record captures its public web presence
  and probed security posture and remains a lead awaiting a provider API surface.
